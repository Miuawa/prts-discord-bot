name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - run: bun x biome format .
      - run: python3 -I -m py_compile modules/control/linux/prts_control.py && bash -n linux/*.sh modules/*/linux/*.sh
      - run: bun test
        env:
          PRTS_NO_SHEET_REFRESH: '1'
      - name: Dry run (no token, no Discord login)
        run: bun src/bot.ts --dry-run && PRTS_MODULES=roleplay bun src/bot.ts --dry-run
        env:
          PRTS_NO_SHEET_REFRESH: '1'
