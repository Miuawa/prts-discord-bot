name: Bug report
description: Something in PRTS does not work as it should
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Command or feature
      placeholder: /operator, /music play, the roleplay module...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A screenshot of the reply helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: "1. /operator name: Texas  2. press Modules  3. ..."
  - type: input
    id: version
    attributes:
      label: Version
      description: From package.json or the release you run.
      placeholder: 0.2.1
  - type: dropdown
    id: ai
    attributes:
      label: AI backend (only if the bug involves /prts or roleplay)
      options: [not AI related, claude-code, anthropic, openai-compatible, auto]
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: From `journalctl --user -u prts-bot` or the console. Remove tokens and IDs first.
      render: text
